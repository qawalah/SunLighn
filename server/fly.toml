# Fly.io: `fly launch --copy-config --no-deploy` (once), `fly volumes create sunwhere_data --size 1`,
# `fly secrets set ADMIN_TOKEN=...`, `fly deploy`. SQLite lives on the volume, so keep ONE machine.
app = "sunwhere"                 # change to a free name: it gives https://<name>.fly.dev
primary_region = "fra"           # the nearest to the Gulf with volumes; `fly platform regions` lists the others

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  PUBLIC_URL = "https://sunwhere.fly.dev"   # your custom domain once `fly certs add` is done

[mounts]
  source = "sunwhere_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # costs nothing while nobody visits; the app works without the server
  auto_start_machines = true
  min_machines_running = 0
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "20s"
      interval = "30s"
      method = "GET"
      path = "/healthz"
      timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
