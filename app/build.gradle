plugins {
    id "com.android.application"
}

android {
    namespace "dev.qawalah.sunlighn"
    compileSdk 35

    defaultConfig {
        applicationId "dev.qawalah.sunlighn"
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName "3.4.2"
    }

    // No release signingConfig: DevStore CI signs the APK.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenStreetMap map view: no account or API key needed.
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    testImplementation "junit:junit:4.13.2"
    // Renders the real screens on a computer, so they can be pressed and checked without a phone.
    testImplementation "org.robolectric:robolectric:4.14.1"
}
