plugins {
    id "com.android.application"
}

android {
    namespace "dev.qawalah.sunlighn"
    compileSdk 35

    defaultConfig {
        applicationId "dev.qawalah.sunlighn"
        minSdk 24
        targetSdk 35
        versionCode 62
        versionName "3.24.1"
        // MapLibre's engine is native code: phones' Arm chips only, so the download stays small (3.15)
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    // No release signingConfig: DevStore CI signs the APK.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // MapLibre's engine compressed in the download (about 10 MB instead of 26); the phone unpacks it on install
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenStreetMap map view: no account or API key needed.
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    // The main map since 3.15: tilts, turns and stands the buildings up (3D). Free, no key (BSD).
    // osmdroid stays for the screen tests, the small maps in the viewfinder, and as the flat map in Settings.
    implementation "org.maplibre.gl:android-sdk:13.7.1"
    // MapLibre's own HTTP client (already inside it), named so the app can set the User-Agent the tile servers ask for
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    // Renders the real screens on a computer, so they can be pressed and checked without a phone.
    testImplementation "org.robolectric:robolectric:4.14.1"
}
