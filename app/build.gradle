plugins {
    id "com.android.application"
}

android {
    namespace "dev.qawalah.sunlighn"
    compileSdk 35

    defaultConfig {
        applicationId "dev.qawalah.sunlighn"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.3.1"
    }

    // No release signingConfig: DevStore CI signs the APK.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenStreetMap map view: no account or API key needed.
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    testImplementation "junit:junit:4.13.2"
}
