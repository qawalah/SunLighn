<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shot shared from SunWhere</title>
<style>
  :root { --bg:#eceae7; --ink:#1b1b1b; --muted:#5b5b5b; --accent:#d9650c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --ink:#f3f5fa; --muted:#a3adc2; --accent:#f59e0b; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:3rem 16px; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color:var(--muted); }
  a.go { display:block; text-align:center; background:var(--accent); color:#111; font-weight:700;
         padding:.9rem 1rem; border-radius:12px; text-decoration:none; margin:1.5rem 0 1rem; }
  code { word-break:break-all; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>A shot shared from SunWhere</h1>
  <p id="msg">Opening it in the app…</p>
  <a class="go" id="open" href="#">Open in SunWhere</a>
  <p>No app yet? SunWhere installs through <a href="https://github.com/qawalah/SunLighn/releases">its releases page</a>
     (or Obtainium). Open this link again afterwards.</p>
</main>
<script>
  // The shot is in the part after the #, so it never goes to any server.
  var code = location.hash.replace(/^#(d=)?/, "");
  var link = "sunwhere://shot?d=" + code;
  var a = document.getElementById("open");
  if (!code) {
    document.getElementById("msg").textContent = "This link holds no shot.";
    a.style.display = "none";
  } else {
    a.href = link;
    setTimeout(function () { location.href = link; }, 300);
  }
</script>
</body>
</html>
